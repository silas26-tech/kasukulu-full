<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kasukulu — Personalized AI Voice Tutors for Zambian Learners</title>
    <meta name="description" content="Personalized AI voice tutors for Zambian learners across Grade 7, Grade 9, and Grade 12 ECZ subjects." />
    <meta property="og:title" content="Kasukulu — Personalized AI Voice Tutors for Zambian Learners" />
    <meta property="og:description" content="Personalized AI voice tutors for Zambian learners across Grade 7, Grade 9, and Grade 12 ECZ subjects." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#047857" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kasukulu" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-100 selection:text-emerald-900">
    <div id="root"></div>
    <script>
      (function () {
        var RECOVERY_KEY = "kasukulu_sw_recovery_v1";
        window.__KASUKULU_MOUNTED__ = false;

        function clearStaleServiceWorkersAndCaches() {
          var tasks = [];
          try {
            if ("serviceWorker" in navigator) {
              tasks.push(
                navigator.serviceWorker
                  .getRegistrations()
                  .then(function (regs) {
                    return Promise.all(
                      regs.map(function (reg) {
                        return reg.unregister().catch(function () {
                          return false;
                        });
                      })
                    );
                  })
                  .catch(function () {})
              );
            }
          } catch (e) {}
          try {
            if ("caches" in window) {
              tasks.push(
                window.caches
                  .keys()
                  .then(function (keys) {
                    return Promise.all(
                      keys.map(function (key) {
                        return window.caches.delete(key).catch(function () {
                          return false;
                        });
                      })
                    );
                  })
                  .catch(function () {})
              );
            }
          } catch (e) {}
          return Promise.all(tasks);
        }

        window.__recoverKasukuluSW = clearStaleServiceWorkersAndCaches;

        function renderRecoveryUI(reason) {
          var root = document.getElementById("root");
          if (!root || window.__KASUKULU_MOUNTED__) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f8fafc;font-family:system-ui,-apple-system,sans-serif;color:#0f172a;">' +
              '<div style="max-width:420px;width:100%;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:24px;box-shadow:0 4px 20px rgba(15,23,42,0.06);">' +
                '<div style="font-size:18px;font-weight:700;margin-bottom:8px;">Refresh Kasukulu</div>' +
                '<p style="font-size:14px;line-height:1.5;color:#475569;margin:0 0 16px;">' +
                  (reason || "Your browser took longer than expected to load a cached update. Stale offline files have been cleared.") +
                "</p>" +
                '<button id="kasukulu-recover-btn" type="button" style="width:100%;padding:12px 16px;border:none;border-radius:12px;background:#047857;color:#ffffff;font-size:14px;font-weight:600;cursor:pointer;">Reload App</button>' +
              "</div>" +
            "</div>";
          var btn = document.getElementById("kasukulu-recover-btn");
          if (btn) {
            btn.addEventListener("click", function () {
              clearStaleServiceWorkersAndCaches().finally(function () {
                try {
                  sessionStorage.removeItem(RECOVERY_KEY);
                } catch (e) {}
                window.location.reload();
              });
            });
          }
        }

        function triggerStartupRecovery(reason) {
          if (window.__KASUKULU_MOUNTED__) return;
          var alreadyReloaded = false;
          try {
            alreadyReloaded = sessionStorage.getItem(RECOVERY_KEY) === "1";
          } catch (e) {}

          clearStaleServiceWorkersAndCaches().finally(function () {
            if (!alreadyReloaded) {
              try {
                sessionStorage.setItem(RECOVERY_KEY, "1");
              } catch (e) {}
              window.location.reload();
              return;
            }
            renderRecoveryUI(reason);
          });
        }

        window.addEventListener(
          "error",
          function (evt) {
            if (window.__KASUKULU_MOUNTED__) return;
            var target = evt && evt.target;
            if (
              target &&
              (target.tagName === "SCRIPT" || target.tagName === "LINK")
            ) {
              triggerStartupRecovery(
                "A cached app script failed to load. Old caches were cleared so you can reload cleanly."
              );
            }
          },
          true
        );

        window.setTimeout(function () {
          if (!window.__KASUKULU_MOUNTED__) {
            triggerStartupRecovery(
              "Startup timed out after 5 seconds. Offline cache has been reset."
            );
          }
        }, 5000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
